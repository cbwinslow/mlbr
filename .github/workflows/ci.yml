name: CI & Lake Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-and-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libarrow-dev

      - name: Install dependencies
        run: |
          Rscript -e 'install.packages(c("devtools", "roxygen2", "duckdb", "arrow", "DBI", "R6", "testthat"))'

      - name: Check mlbr Package
        run: |
          R CMD build pkg/mlbr
          R CMD check mlbr_*.tar.gz --no-manual --as-cran
