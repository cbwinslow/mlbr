project:
  type: website
  output-dir: docs

website:
  title: "mlbr"
  description: "Production Sabermetrics Data Lake & Machine Learning Platform"
  site-url: "https://cloudcurio.cc"
  repo-url: "https://github.com/cbwinslow/mlbr"
  repo-actions: [issue]
  navbar:
    title: "mlbr"
    left:
      - href: index.qmd
        text: "Home"
      - href: analyses/experiment_registry.qmd
        text: "Knowledge Base"
      - href: analyses/01_pitch_quality_eda.qmd
        text: "Q-CRISP Research"
      - href: workbooks/lab01_aerodynamics_workbook.qmd
        text: "Student Labs"
      - href: gallery.qmd
        text: "Analyses Gallery"
      - href: architecture.qmd
        text: "Architecture"
      - href: setup.qmd
        text: "Setup & API"
      - href: crosswalk.qmd
        text: "ID Crosswalk"
      - href: verification.qmd
        text: "Data Proofs"
      - href: agent_context.qmd
        text: "AI Agent Guide"
      - href: data_dictionary.qmd
        text: "Data Dictionary"
    right:
      - icon: github
        href: "https://github.com/cbwinslow/mlbr"
  sidebar:
    - id: main
      collapse-level: 2
      style: docked
      contents:
        - section: "Getting Started"
          contents:
            - text: "Overview & Dashboard"
              href: index.qmd
            - text: "Installation & Setup"
              href: setup.qmd
            - text: "Universal ID Crosswalk"
              href: crosswalk.qmd
            - text: "Architecture & Storage"
              href: architecture.qmd
            - text: "Verification & Proofs"
              href: verification.qmd
            - text: "AI Agent Data Manifest"
              href: agent_context.qmd
            - text: "Data Dictionary & Schemas"
              href: data_dictionary.qmd
        - section: "Student Work-Along Labs"
          contents:
            - text: "Lab 01: Aerodynamics & Trajectory Math"
              href: workbooks/lab01_aerodynamics_workbook.qmd
        - section: "Q-CRISP Research Series"
          contents:
            - text: "Knowledge Base & Registry"
              href: analyses/experiment_registry.qmd
            - text: "Study 01: Aerodynamics & Approach Angles"
              href: analyses/01_pitch_quality_eda.qmd
            - text: "Study 02: 4-Quadrant Platoon Physics"
              href: analyses/02_platoon_physics.qmd
            - text: "Study 03: Pitch Tunneling & Stuff+"
              href: analyses/03_tunneling_stuff_plus.qmd
        - section: "Analyses Gallery"
          contents:
            - text: "Gallery Overview"
              href: gallery.qmd
            - text: "Pitch Clustering (K-Means / GMM)"
              href: analyses/pitch_clustering.qmd
            - text: "Pitch Classification (Random Forest)"
              href: analyses/pitch_classification.qmd
            - text: "xWOBA / Exit Velocity Surface"
              href: analyses/xwoba_surface.qmd
            - text: "Run Expectancy RE24 Matrix"
              href: analyses/run_expectancy.qmd

format:
  html:
    theme:
      dark: darkly
    css: styles.css
    toc: true
    toc-depth: 3
    code-fold: show
    code-tools: true
    code-copy: true
    df-print: paged
    fig-format: retina
    fig-width: 8
    fig-height: 5

execute:
  freeze: auto
  warning: false
  message: false
