format:
  html:
    theme:
      dark: darkly
    css: styles.css
    toc: true
    toc-depth: 3
    code-fold: show
    code-tools: true
    code-copy: true
    df-print: paged
    fig-format: retina
    fig-width: 8
    fig-height: 5

execute:
  freeze: auto
  warning: false
  message: false
